<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; user-select:none; }
  #btn { position:absolute; left:4px; top:4px; width:calc(100vw - 8px); height:calc(100vh - 8px); border-radius:50%;
    background:var(--bg); display:grid; place-items:center; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.35); transition:transform .12s, background .2s; }
  #btn:hover { transform:scale(1.06); }
  #btn svg { width:46%; height:46%; }
  body.dark { --bg:#1c1f26; --ring:#3a404d; }
  body.light { --bg:#ffffff; --ring:#e4dfd5; }
  body.light #btn { box-shadow:0 4px 14px rgba(0,0,0,.18), inset 0 0 0 1px var(--ring); }
  body.rec #btn { background:#ff5a3c; }
  body.rec #btn svg * { fill:#fff; stroke:#fff; }
  body.rec #btn rect { fill:#fff; }
</style>
</head>
<body class="dark">
  <div id="btn" title="SayIt: click to speak · drag to move · right-click for menu">
    <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" fill="#ff5a3c"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" stroke="#ff5a3c" stroke-width="2" stroke-linecap="round"/><path d="M12 17.5V21M9 21h6" stroke="#ff5a3c" stroke-width="2" stroke-linecap="round"/></svg>
  </div>
<script src="button.js"></script>
</body>
</html>
