<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin:0; height:100%; overflow:hidden; user-select:none;
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body.dark  { --bg:#1c1f26; --fg:#f4f1ea; --muted:#8c8a85; --sub:#2c313c; --line:#3a404d; --textbg:#14161b; --text:#fbf8f2; --wait:#9a978f; --link:#ffb199; }
  body.light { --bg:#ffffff; --fg:#1c1f26; --muted:#6b6862; --sub:#f3f0ea; --line:#e4dfd5; --textbg:#faf7f1; --text:#1c1f26; --wait:#8c8a85; --link:#c43d22; }
  body { background:var(--bg); color:var(--fg); }
  #panel { position:absolute; inset:0; display:flex; flex-direction:column; padding:10px 12px 8px; box-sizing:border-box; border:1px solid var(--line); border-radius:14px; }
  body.mac #panel { border-radius:12px; }

  /* top bar: drag here to move the box */
  .top { display:flex; align-items:center; gap:8px; cursor:grab; padding-bottom:2px; }
  .top:active { cursor:grabbing; }
  .dot { width:11px; height:11px; border-radius:50%; background:#ff5a3c; flex:none; animation:pulse 1.3s infinite; }
  body.working .dot { background:#f5b83d; animation:spin .8s linear infinite; border-radius:3px; }
  body.done .dot { background:#3fbf6b; animation:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,90,60,.55)} 70%{box-shadow:0 0 0 9px rgba(255,90,60,0)} 100%{box-shadow:0 0 0 0 rgba(255,90,60,0)} }
  @keyframes spin { to { transform:rotate(360deg); } }
  #status { font-weight:650; flex:1; min-width:4em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #time { color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px; flex:none; }
  #meter { display:flex; gap:3px; align-items:center; height:16px; flex:none; }
  #meter i { width:3px; border-radius:2px; background:#ff8a6e; height:3px; transition:height .08s; }
  .icon { background:transparent; color:var(--muted); border:0; font:inherit; font-size:16px; line-height:1; width:26px; height:26px; border-radius:7px; cursor:pointer; flex:none; }
  .icon:hover { background:var(--sub); color:var(--fg); }
  .size { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; flex:none; }
  .size button { background:var(--sub); color:var(--fg); border:0; font:inherit; font-size:12px; padding:2px 8px; cursor:pointer; }
  .size button + button { border-left:1px solid var(--line); }

  /* your words */
  #text { flex:1; margin:8px 0; overflow:auto; white-space:pre-wrap; word-wrap:break-word; background:var(--textbg); border-radius:10px;
    padding:10px 12px; font-size:var(--t, 19px); line-height:1.5; color:var(--text); user-select:text; cursor:text; }
  body.ts-s { --t:15px; } body.ts-m { --t:17px; } body.ts-l { --t:20px; } body.ts-xl { --t:25px; }
  #text .wait { color:var(--wait); }
  #text .hint { color:var(--muted); font-size:15px; }

  /* bottom bar */
  .bottom { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pill { background:var(--sub); color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:4px 11px; font:inherit; font-size:12.5px; cursor:pointer; white-space:nowrap; }
  .pill:hover { border-color:#ff5a3c; }
  .grow { flex:1; }
  button.act { border:0; border-radius:9px; padding:7px 14px; font:inherit; font-weight:650; cursor:pointer; white-space:nowrap; }
  #done { background:#ff5a3c; color:#fff; } #done:hover { background:#ff7154; }
  #cancel { background:transparent; color:var(--muted); } #cancel:hover { color:var(--fg); }
  button:disabled { opacity:.45; cursor:default; }
  .foot { margin-top:4px; font-size:11.5px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; padding-right:14px; }
  .foot a { color:var(--link); cursor:pointer; }

  #text .del { color:#d9534f; text-decoration:line-through; opacity:.8; }
  #text .ins { color:#2e9e5b; text-decoration:underline; text-decoration-color:rgba(46,158,91,.5); text-underline-offset:3px; }
  body.dark #text .del { color:#ff8f7a; } body.dark #text .ins { color:#7fd99a; }
  [hidden] { display:none !important; }
  /* drag this corner to resize */
  #grip { position:absolute; right:2px; bottom:2px; width:16px; height:16px; cursor:nwse-resize; opacity:.55; }
  #grip::before { content:""; position:absolute; right:3px; bottom:3px; width:9px; height:9px;
    background:linear-gradient(135deg, transparent 45%, var(--muted) 45%, var(--muted) 55%, transparent 55%, transparent 70%, var(--muted) 70%, var(--muted) 80%, transparent 80%); }
</style>
</head>
<body class="dark ts-l">
  <div id="panel">
    <div class="top" id="top" title="Drag to move">
      <span class="dot"></span><span id="status">Listening…</span>
      <span id="meter"></span><span id="time">0:00</span>
      <span class="size"><button id="smaller" title="Smaller text">A−</button><button id="bigger" title="Bigger text">A+</button></span>
      <button class="icon" id="close" title="Cancel (Esc)">✕</button>
    </div>
    <div id="text"></div>
    <div class="bottom">
      <button class="pill" id="mode" title="Change what happens to your words"></button>
      <button class="pill" id="copy" title="Copy the text">Copy</button>
      <span class="grow"></span>
      <button class="act" id="cancel">Cancel</button>
      <button class="pill" id="mine" hidden title="Insert what you said, without the changes">Use my words</button>
      <button class="act" id="done">Done</button>
    </div>
    <div class="foot"><span id="hk"></span><a id="settings">Settings</a></div>
    <div id="grip" title="Drag to resize"></div>
  </div>
<script src="panel.js"></script>
</body>
</html>
