<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SayIt: allow microphone</title>
<style>
  body { margin:0; background:#faf7f1; color:#1c1f26; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:grid; place-items:center; min-height:100vh; }
  .card { background:#fff; border:1px solid #e4dfd5; border-radius:16px; padding:28px 30px; max-width:440px; text-align:center; }
  img { width:56px; } h1 { font-size:22px; margin:10px 0 6px; } p { color:#6b6862; margin:0 0 18px; }
  button { font:inherit; font-weight:650; border:0; border-radius:10px; padding:11px 20px; background:#e8492b; color:#fff; cursor:pointer; }
  .ok { color:#1f7a3f; font-weight:650; } .bad { color:#b3261e; }
</style></head>
<body><div class="card">
  <img src="icons/icon128.png" alt="">
  <h1>Allow SayIt to use your microphone</h1>
  <p>You only do this once. After this, SayIt works on every website without asking again.</p>
  <button id="go">Allow microphone</button>
  <p id="msg" style="margin-top:16px"></p>
</div>
<script src="mic.js"></script>
</body></html>
